x-backend-image: &backend-image
  image: ghcr.io/${GHCR_OWNER}/receptiviq-backend:${IMAGE_TAG:-latest}

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
  SECRET_KEY: ${SECRET_KEY}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  WAREHOUSE_BACKEND: ${WAREHOUSE_BACKEND:-duckdb}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GA4_CLIENT_ID: ${GA4_CLIENT_ID:-}
  GA4_CLIENT_SECRET: ${GA4_CLIENT_SECRET:-}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
  HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  backend:
    <<: *backend-image
    restart: unless-stopped
    environment:
      <<: *backend-env
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  celery:
    <<: *backend-image
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info --concurrency=4
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_started

  frontend:
    image: ghcr.io/${GHCR_OWNER}/receptiviq-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
