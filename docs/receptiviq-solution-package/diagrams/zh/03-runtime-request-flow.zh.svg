<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700">
  <defs>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker>
    <style>
      .title{font:700 26px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#152238}
      .head{font:700 13px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2d3d}
      .msg{font:500 12px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#25364a}
      .note{font:500 12px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#607086}
      .box{fill:#f7fbff;stroke:#9bb3c8;stroke-width:1.4;rx:8}
      .life{stroke:#b7c4d3;stroke-width:1.4;stroke-dasharray:5 6}
      .line{stroke:#34495e;stroke-width:2;fill:none;marker-end:url(#c)}
      .return{stroke:#5e7c62;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#c)}
    </style>
  </defs>
  <rect width="1320" height="700" fill="#fff"/>
  <text x="42" y="48" class="title">运行时请求流程</text>
  <text x="42" y="74" class="note">从门户请求到 Auth/RBAC、Core AI Brain、Snowflake、Pillar Agent 和审计日志的运行链路。</text>

  <rect x="40" y="110" width="130" height="46" class="box"/><text x="105" y="139" text-anchor="middle" class="head">用户</text>
  <rect x="220" y="110" width="130" height="46" class="box"/><text x="285" y="139" text-anchor="middle" class="head">门户</text>
  <rect x="400" y="110" width="130" height="46" class="box"/><text x="465" y="139" text-anchor="middle" class="head">Auth + RBAC</text>
  <rect x="580" y="110" width="130" height="46" class="box"/><text x="645" y="139" text-anchor="middle" class="head">Core AI Brain</text>
  <rect x="760" y="110" width="130" height="46" class="box"/><text x="825" y="139" text-anchor="middle" class="head">Snowflake</text>
  <rect x="940" y="110" width="130" height="46" class="box"/><text x="1005" y="139" text-anchor="middle" class="head">Pillar Agent</text>
  <rect x="1120" y="110" width="130" height="46" class="box"/><text x="1185" y="139" text-anchor="middle" class="head">审计日志</text>

  <line x1="105" y1="156" x2="105" y2="650" class="life"/>
  <line x1="285" y1="156" x2="285" y2="650" class="life"/>
  <line x1="465" y1="156" x2="465" y2="650" class="life"/>
  <line x1="645" y1="156" x2="645" y2="650" class="life"/>
  <line x1="825" y1="156" x2="825" y2="650" class="life"/>
  <line x1="1005" y1="156" x2="1005" y2="650" class="life"/>
  <line x1="1185" y1="156" x2="1185" y2="650" class="life"/>

  <path class="line" d="M105 205 L285 205"/><text x="118" y="195" class="msg">请求洞察、报告、persona、创意或媒体建议</text>
  <path class="line" d="M285 255 L465 255"/><text x="298" y="245" class="msg">校验用户、租户、角色和 client scope</text>
  <path class="return" d="M465 305 L285 305"/><text x="315" y="295" class="msg">返回授权上下文</text>
  <path class="line" d="M285 355 L645 355"/><text x="298" y="345" class="msg">提交带租户上下文的任务</text>
  <path class="line" d="M645 405 L1185 405"/><text x="658" y="395" class="msg">记录请求元数据</text>
  <path class="line" d="M645 455 L825 455"/><text x="658" y="445" class="msg">按租户策略查询语义层</text>
  <path class="return" d="M825 505 L645 505"/><text x="665" y="495" class="msg">返回 RLS 过滤后的 processed data</text>
  <path class="line" d="M645 555 L1005 555"/><text x="658" y="545" class="msg">调用对应 pillar agent</text>
  <path class="return" d="M1005 605 L645 605"/><text x="675" y="595" class="msg">返回结构化输出、置信度和引用</text>
  <path class="line" d="M645 645 L1185 645"/><text x="658" y="635" class="msg">记录模型、token、数据访问和输出元数据</text>
</svg>

