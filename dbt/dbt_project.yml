name: "receptiviq"
version: "1.0.0"
config-version: 2

profile: "receptiviq"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  receptiviq:
    staging:
      +materialized: view
      +schema: staging
    canonical:
      +materialized: incremental
      +schema: canonical
    marts:
      +materialized: table
      +schema: marts
